import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.4.20"
}

// Minecraft version specific dependency versions live in versions/<mc>.properties
def targetProperties = new Properties()
file("versions/${project.mc}.properties").withInputStream { targetProperties.load(it) }
targetProperties.each { key, value -> project.ext.set(key, value) }

// e.g. 1.0.0+26.2, one jar per Minecraft version
version = "${project.version}+${project.minecraft_version}"

repositories {
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"chatplus-hypixel" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// ./gradlew runClientGameTest: opens a singleplayer world, feeds Hypixel style chat lines and saves screenshots
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "chatplus-hypixel-gametest"
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	// Optional: config screen button in the Mod Menu list
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	testImplementation "org.jetbrains.kotlin:kotlin-test-junit5"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// the parser tests only need the client classes, not a running game
sourceSets {
	test {
		compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
	}
}

tasks.named("test") {
	useJUnitPlatform()
}

processResources {
	def expansions = [version: project.version, minecraft_dependency: project.minecraft_dependency]
	inputs.properties expansions

	filesMatching("fabric.mod.json") {
		expand expansions
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

kotlin {
	compilerOptions {
		jvmTarget = JvmTarget.JVM_25
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
