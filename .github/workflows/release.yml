# Pushing a tag like v1.0.1 builds a jar for every Minecraft version in versions/
# and publishes them as a GitHub release, with the notes from CHANGELOG.md.

name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: check tag matches gradle.properties
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version=$version in gradle.properties" >&2
            exit 1
          fi
      - name: build every minecraft version
        run: |
          for file in versions/*.properties; do
            ./gradlew build -Pmc="$(basename "$file" .properties)"
          done
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # the lines below "## <version>" in CHANGELOG.md, up to the next version
          awk -v v="$version" '/^## /{ p = ($2 == v); next } p' CHANGELOG.md > notes.md
          jars=$(ls build/libs/*.jar | grep -v -- '-sources.jar')
          gh release create "$GITHUB_REF_NAME" $jars --title "ChatPlus - Hypixel $version" --notes-file notes.md
